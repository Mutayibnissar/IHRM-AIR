name: Deploy IHRM Air to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run reusable site integrity checks
        run: python scripts/validate_site.py

      - name: Check JavaScript syntax
        run: |
          node --check assets/ihrm-refresh.js
          node --check service-worker.js
          python scripts/check_inline_scripts.py
          node scripts/check_question_bank_parity.js

      - name: Run browser smoke tests
        run: |
          npm install --prefix /tmp/ihrm-air-playwright playwright
          node /tmp/ihrm-air-playwright/node_modules/playwright/cli.js install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ihrm-air-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE=/tmp/ihrm-air-playwright/node_modules/playwright node scripts/browser-smoke.cjs

      - name: Validate multi-page study hub
        run: |
          python - <<'PY'
          from pathlib import Path
          required = {
              "index.html": ["units.html", "practice.html", "tools.html", "id=\"homeAttempts\"", "id=\"homeAccuracy\"", "id=\"homeBest\"", "site-nav-toggle"],
              "units.html": ["id=\"u1\"", "id=\"u2\"", "id=\"u3\"", "id=\"u4\""],
              "practice.html": ["id=\"exam-centre\"", "id=\"quiz\"", "id=\"integrated-cards\""],
              "tools.html": ["Study Tools Hub", "href=\"planner.html\"", "href=\"tracker.html\"", "href=\"backup.html\""],
              "planner.html": ["Study Planner", "planner"],
              "tracker.html": ["Session Tracker", "tracker"],
              "backup.html": ["Backup", "backup"],
              "references.html": ["Evidence & Sources", "ILO", "OECD", "Google Scholar", "draft"],
          }
          for filename, markers in required.items():
              path = Path(filename)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty page: {filename}")
              source = path.read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in source:
                      raise SystemExit(f"{filename} is missing required marker: {marker}")
              if source.count('id="sitePageNav"') != 1:
                  raise SystemExit(f"{filename} must contain exactly one main navigation.")
              if source.count("<footer") > 1:
                  raise SystemExit(f"{filename} contains an unexpected duplicate footer.")
          print("All IHRM Air pages and required sections are present.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
