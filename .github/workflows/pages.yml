name: Deploy IHRM Air to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run reusable site integrity checks
        run: python scripts/validate_site.py

      - name: Check JavaScript syntax
        run: |
          node --check assets/ihrm-refresh.js
          node --check service-worker.js

      - name: Validate multi-page study hub
        run: |
          python - <<'PY'
          from pathlib import Path
          required = {
              "index.html": ["units.html", "practice.html", "tools.html", "id=\"homeAttempts\"", "id=\"homeAccuracy\"", "id=\"homeBest\"", "site-nav-toggle"],
              "units.html": ["id=\"u1\"", "id=\"u2\"", "id=\"u3\"", "id=\"u4\""],
              "practice.html": ["id=\"exam-centre\"", "id=\"quiz\"", "id=\"integrated-cards\""],
              "tools.html": ["Study Tools Hub", "href=\"planner.html\"", "href=\"tracker.html\"", "href=\"backup.html\""],
              "planner.html": ["Study Planner", "planner"],
              "tracker.html": ["Session Tracker", "tracker"],
              "backup.html": ["Backup", "backup"],
          }
          for filename, markers in required.items():
              path = Path(filename)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty page: {filename}")
              source = path.read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in source:
                      raise SystemExit(f"{filename} is missing required marker: {marker}")
              if source.count('id="sitePageNav"') != 1:
                  raise SystemExit(f"{filename} must contain exactly one main navigation.")
              if source.count("<footer") > 1:
                  raise SystemExit(f"{filename} contains an unexpected duplicate footer.")
          print("All IHRM Air pages and required sections are present.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
